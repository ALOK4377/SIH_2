# Serve the SPA on 5173; route every unknown path back to index.html so the
# client-side router (React Router) can handle deep links like /codes.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted assets Vite emits.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
